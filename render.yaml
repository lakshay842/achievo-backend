services:
  - type: web
    name: achievo-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_AI
        value: "false"
      - key: NOTIFICATIONS_DRY_RUN
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: LOG_LEVEL
        value: info
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
